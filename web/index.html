<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d2240" />
    <title>Transit Japan 3D</title>
    <style>
      :root {
        --bp-navy: #0d2240;
        --bp-navy-2: #123059;
        --bp-cyan: #5dd4f0;
        --bp-ink: #e8f0fa;
        --bp-muted: #8fa8c9;
        --bp-line: rgba(93, 212, 240, 0.28);
        --bp-panel: rgba(13, 34, 64, 0.88);
        --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        --sans: Inter, system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bp-navy); }
      #map { position: absolute; inset: 0; }

      .hud {
        background:
          linear-gradient(var(--bp-panel), var(--bp-panel)),
          repeating-linear-gradient(0deg, transparent 0 11px, rgba(93, 212, 240, 0.05) 11px 12px),
          repeating-linear-gradient(90deg, transparent 0 11px, rgba(93, 212, 240, 0.05) 11px 12px);
        color: var(--bp-ink);
        border: 1px solid var(--bp-line);
        border-radius: 4px;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }

      #panel {
        position: absolute; top: max(10px, env(safe-area-inset-top)); left: 10px; z-index: 10;
        padding: 10px 12px 12px; font-family: var(--sans); font-size: 13px; max-width: 230px;
      }
      #panel h1 {
        font-family: var(--mono); font-size: 12px; letter-spacing: 0.12em; margin: 0 0 2px;
        color: var(--bp-cyan); text-transform: uppercase;
      }
      #panel .sub {
        font-family: var(--mono); font-size: 9.5px; color: var(--bp-muted);
        letter-spacing: 0.08em; margin: 0 0 8px; border-bottom: 1px solid var(--bp-line); padding-bottom: 7px;
      }
      #panel label {
        display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer;
        user-select: none; -webkit-user-select: none; line-height: 1.4;
      }
      #panel input[type="checkbox"] { accent-color: var(--bp-cyan); margin: 0; }
      .chip { width: 14px; height: 4px; border-radius: 1px; flex-shrink: 0; }
      .chip.dot { width: 7px; height: 7px; border-radius: 50%; }
      #legend {
        margin-top: 8px; padding-top: 7px; border-top: 1px solid var(--bp-line);
        display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px;
        font-family: var(--mono); font-size: 9.5px; color: var(--bp-muted);
      }
      #legend span { display: flex; align-items: center; gap: 5px; }
      #legend .chip { width: 10px; height: 3px; }

      #tooltip {
        position: absolute; z-index: 20; pointer-events: none; display: none;
        padding: 7px 11px; font-family: var(--sans); font-size: 12px; max-width: 280px;
        border-left: 2px solid var(--bp-cyan);
      }
      #tooltip strong { color: var(--bp-ink); }
      #tooltip .op { color: var(--bp-muted); font-family: var(--mono); font-size: 10.5px; }
      #tooltip.pinned { pointer-events: auto; }
      #tooltip .focus-link {
        display: block; margin-top: 6px; padding: 3px 8px; cursor: pointer;
        background: none; border: 1px solid var(--bp-line); border-radius: 3px;
        color: var(--bp-cyan); font-family: var(--mono); font-size: 11px; letter-spacing: 0.04em;
      }
      #tooltip .focus-link:hover { border-color: var(--bp-cyan); }

      /* モード特化ビュー: パネルは対象モードの操作のみ残す */
      .mode-link {
        margin-left: auto; color: var(--bp-cyan); text-decoration: none;
        font-family: var(--mono); font-size: 12px; padding: 0 3px; border-radius: 3px;
      }
      .mode-link:hover { background: rgba(93, 212, 240, 0.15); }
      #back-overview {
        display: none; color: var(--bp-cyan); text-decoration: none;
        font-family: var(--mono); font-size: 11px; letter-spacing: 0.05em; margin-bottom: 6px;
      }
      #focus-title { display: none; font-family: var(--mono); font-size: 11px; color: var(--bp-ink); margin-bottom: 4px; letter-spacing: 0.08em; }
      body[data-focus] #back-overview, body[data-focus] #focus-title { display: block; }
      body[data-focus] #panel label { display: none; }
      body[data-focus] .mode-link { display: none; }
      body[data-focus="rail"] #panel label.row-stations,
      body[data-focus="rail"] #panel label.row-vehicles { display: flex; }
      body[data-focus]:not([data-focus="rail"]) #legend { display: none; }
      body[data-focus]:not([data-focus="rail"]) #era { display: none; }

      #era {
        position: absolute; bottom: max(28px, env(safe-area-inset-bottom)); left: 50%;
        transform: translateX(-50%); z-index: 10; display: flex; align-items: center; gap: 12px;
        padding: 9px 16px; font-family: var(--mono); width: min(72vw, 440px);
      }
      #era-label {
        font-size: 13px; font-weight: 600; min-width: 4.6em; text-align: center;
        color: var(--bp-cyan); letter-spacing: 0.06em;
      }
      #era-slider { flex: 1; accent-color: var(--bp-cyan); margin: 0; }
      #era .tick { font-size: 9px; color: var(--bp-muted); }

      #search {
        position: absolute; top: max(10px, env(safe-area-inset-top)); right: 52px; z-index: 10;
        width: min(46vw, 260px);
      }
      #search-input {
        width: 100%; box-sizing: border-box; padding: 8px 12px;
        background: var(--bp-panel); color: var(--bp-ink);
        border: 1px solid var(--bp-line); border-radius: 4px;
        font-family: var(--mono); font-size: 12px; letter-spacing: 0.03em;
        backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      }
      #search-input::placeholder { color: var(--bp-muted); }
      #search-input:focus { outline: none; border-color: var(--bp-cyan); }
      #search-results { display: none; margin-top: 4px; }
      .search-item {
        display: block; width: 100%; text-align: left; padding: 7px 12px; cursor: pointer;
        background: var(--bp-panel); color: var(--bp-ink); border: 1px solid var(--bp-line);
        border-radius: 4px; margin-bottom: 3px; font-family: var(--sans); font-size: 12.5px;
      }
      .search-item:hover { border-color: var(--bp-cyan); }

      #station-panel {
        position: absolute; right: 10px; bottom: max(28px, env(safe-area-inset-bottom)); z-index: 15;
        display: none; width: min(88vw, 320px); max-height: 45vh; overflow-y: auto;
        padding: 10px 12px 12px; font-family: var(--sans); font-size: 12.5px;
      }
      #station-panel .sp-head { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--bp-line); padding-bottom: 6px; margin-bottom: 6px; }
      #station-panel .sp-title { font-family: var(--mono); color: var(--bp-cyan); font-size: 13px; letter-spacing: 0.06em; }
      #station-panel .close { background: none; border: 1px solid var(--bp-line); color: var(--bp-muted); border-radius: 3px; cursor: pointer; font-family: var(--mono); font-size: 11px; padding: 2px 8px; }
      #station-panel .sp-row { display: flex; gap: 8px; padding: 4px 0; align-items: baseline; }
      #station-panel .sp-time { font-family: var(--mono); color: var(--bp-cyan); min-width: 4.2em; font-size: 12px; }
      #station-panel .sp-type { font-family: var(--mono); font-size: 10.5px; color: var(--bp-muted); min-width: 3em; }
      #station-panel .sp-dest { flex: 1; }
      #station-panel .sp-empty { color: var(--bp-muted); }

      @media (max-width: 480px) {
        #panel { max-width: 150px; font-size: 12px; }
        #legend { grid-template-columns: 1fr; }
        #era { width: 86vw; gap: 8px; padding: 8px 12px; }
        #search { width: 40vw; }
        /* 発車標が年代スライダーを覆わないよう持ち上げる */
        #station-panel { bottom: calc(max(28px, env(safe-area-inset-bottom)) + 62px); max-height: 38vh; }
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="panel" class="hud">
      <h1>Transit Japan 3D</h1>
      <p class="sub">// nationwide public transport</p>
      <a id="back-overview" href="#">← 全体表示に戻る</a>
      <div id="focus-title"></div>
      <label class="row-rail"><input type="checkbox" id="toggle-rail" checked /><span class="chip" style="background:#5b8cff"></span>鉄道路線<a class="mode-link" data-mode="rail" href="#" title="鉄道特化ビュー">→</a></label>
      <label class="row-stations"><input type="checkbox" id="toggle-stations" checked /><span class="chip dot" style="background:#e8edf7"></span>駅</label>
      <label class="row-bus"><input type="checkbox" id="toggle-bus" /><span class="chip" style="background:#ffca28"></span>バス<span class="tick" style="font-family:var(--mono);font-size:9px;color:var(--bp-muted)">(重め)</span><a class="mode-link" data-mode="bus" href="#" title="バス特化ビュー">→</a></label>
      <label class="row-ferry"><input type="checkbox" id="toggle-ferry" checked /><span class="chip" style="background:#4dd0e1"></span>航路(船)<a class="mode-link" data-mode="ferry" href="#" title="航路特化ビュー">→</a></label>
      <label class="row-air"><input type="checkbox" id="toggle-air" checked /><span class="chip" style="background:#f06292"></span>空路・空港<a class="mode-link" data-mode="air" href="#" title="空路特化ビュー">→</a></label>
      <label class="row-ropeway"><input type="checkbox" id="toggle-ropeway" checked /><span class="chip" style="background:#aed581"></span>索道<a class="mode-link" data-mode="ropeway" href="#" title="索道特化ビュー">→</a></label>
      <label class="row-vehicles"><input type="checkbox" id="toggle-vehicles" /><span class="chip dot" style="background:#ffca28"></span>車両(時刻表)</label>
      <div id="vehicle-ctl" style="display:none; margin-top:4px; font-family:var(--mono); font-size:10.5px; align-items:center; gap:8px;">
        <span id="clock" style="color:var(--bp-cyan); letter-spacing:0.05em;">--:--</span>
        <select id="speed" aria-label="再生速度" style="background:var(--bp-navy-2); color:var(--bp-ink); border:1px solid var(--bp-line); border-radius:3px; font-family:var(--mono); font-size:10.5px;">
          <option value="1">1×</option>
          <option value="10">10×</option>
          <option value="60" selected>60×</option>
          <option value="300">300×</option>
          <option value="0">⏸</option>
        </select>
        <span id="veh-count" style="color:var(--bp-muted);"></span>
      </div>
      <div id="legend">
        <span><span class="chip" style="background:#38d39f"></span>新幹線</span>
        <span><span class="chip" style="background:#5b8cff"></span>JR</span>
        <span><span class="chip" style="background:#ffab40"></span>民鉄</span>
        <span><span class="chip" style="background:#ff6384"></span>路面電車</span>
        <span><span class="chip" style="background:#ba68c8"></span>モノレール</span>
        <span><span class="chip" style="background:#ffeb3b"></span>ケーブルカー</span>
      </div>
    </div>
    <div id="search">
      <input id="search-input" type="search" placeholder="駅・場所を検索…" aria-label="駅・場所を検索" autocomplete="off" />
      <div id="search-results"></div>
    </div>
    <div id="station-panel" class="hud">
      <div class="sp-head"><span class="sp-title"></span><button type="button" class="close">閉じる</button></div>
      <div class="sp-list"></div>
    </div>
    <div id="tooltip" class="hud"></div>
    <div id="era" class="hud">
      <span class="tick">1950</span>
      <input type="range" id="era-slider" min="1950" max="2026" step="1" value="2026" aria-label="表示する年代" />
      <span id="era-label">現在</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
