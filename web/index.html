<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <title>Transit Japan 3D</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1020; }
      #map { position: absolute; inset: 0; }
      #panel {
        position: absolute; top: max(10px, env(safe-area-inset-top)); left: 10px; z-index: 10;
        background: rgba(11, 16, 32, 0.85); color: #e8edf7; border: 1px solid #26314f;
        border-radius: 10px; padding: 10px 14px; font-family: system-ui, sans-serif;
        font-size: 13px; backdrop-filter: blur(6px); max-width: 220px;
      }
      #panel h1 { font-size: 14px; margin: 0 0 6px; letter-spacing: 0.02em; }
      #panel label { display: flex; align-items: center; gap: 6px; padding: 3px 0; cursor: pointer; user-select: none; }
      #tooltip {
        position: absolute; z-index: 20; pointer-events: none; display: none;
        background: rgba(11, 16, 32, 0.92); color: #e8edf7; border: 1px solid #26314f;
        border-radius: 8px; padding: 6px 10px; font-family: system-ui, sans-serif; font-size: 12px;
        max-width: 260px;
      }
      #tooltip .op { color: #98a4bd; }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="panel">
      <h1>Transit Japan 3D</h1>
      <label><input type="checkbox" id="toggle-rail" checked />鉄道路線</label>
      <label><input type="checkbox" id="toggle-stations" checked />駅</label>
      <label><input type="checkbox" id="toggle-bus" />バス(重め)</label>
      <label><input type="checkbox" id="toggle-ferry" checked />航路(船)</label>
      <label><input type="checkbox" id="toggle-air" checked />空路・空港</label>
      <label><input type="checkbox" id="toggle-ropeway" checked />索道</label>
    </div>
    <div id="tooltip"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
