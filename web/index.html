<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d2240" />
    <title>Transit Japan 3D</title>
    <style>
      :root {
        --bp-navy: #0d2240;
        --bp-navy-2: #123059;
        --bp-cyan: #5dd4f0;
        --bp-ink: #e8f0fa;
        --bp-muted: #8fa8c9;
        --bp-line: rgba(93, 212, 240, 0.28);
        --bp-panel: rgba(13, 34, 64, 0.88);
        --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        --sans: Inter, system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bp-navy); }
      #map { position: absolute; inset: 0; }

      .hud {
        background:
          linear-gradient(var(--bp-panel), var(--bp-panel)),
          repeating-linear-gradient(0deg, transparent 0 11px, rgba(93, 212, 240, 0.05) 11px 12px),
          repeating-linear-gradient(90deg, transparent 0 11px, rgba(93, 212, 240, 0.05) 11px 12px);
        color: var(--bp-ink);
        border: 1px solid var(--bp-line);
        border-radius: 4px;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }

      #panel {
        position: absolute; top: max(10px, env(safe-area-inset-top)); left: 10px; z-index: 10;
        padding: 10px 12px 12px; font-family: var(--sans); font-size: 13px; max-width: 230px;
      }
      #panel h1 {
        font-family: var(--mono); font-size: 12px; letter-spacing: 0.12em; margin: 0 0 2px;
        color: var(--bp-cyan); text-transform: uppercase;
      }
      #panel .sub {
        font-family: var(--mono); font-size: 9.5px; color: var(--bp-muted);
        letter-spacing: 0.08em; margin: 0 0 8px; border-bottom: 1px solid var(--bp-line); padding-bottom: 7px;
      }
      #panel label {
        display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer;
        user-select: none; -webkit-user-select: none; line-height: 1.4;
      }
      #panel input[type="checkbox"] { accent-color: var(--bp-cyan); margin: 0; }
      .chip { width: 14px; height: 4px; border-radius: 1px; flex-shrink: 0; }
      .chip.dot { width: 7px; height: 7px; border-radius: 50%; }
      #legend {
        margin-top: 8px; padding-top: 7px; border-top: 1px solid var(--bp-line);
        display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px;
        font-family: var(--mono); font-size: 9.5px; color: var(--bp-muted);
      }
      #legend span { display: flex; align-items: center; gap: 5px; }
      #legend .chip { width: 10px; height: 3px; }

      #tooltip {
        position: absolute; z-index: 20; pointer-events: none; display: none;
        padding: 7px 11px; font-family: var(--sans); font-size: 12px; max-width: 280px;
        border-left: 2px solid var(--bp-cyan);
      }
      #tooltip strong { color: var(--bp-ink); }
      #tooltip .op { color: var(--bp-muted); font-family: var(--mono); font-size: 10.5px; }

      #era {
        position: absolute; bottom: max(28px, env(safe-area-inset-bottom)); left: 50%;
        transform: translateX(-50%); z-index: 10; display: flex; align-items: center; gap: 12px;
        padding: 9px 16px; font-family: var(--mono); width: min(72vw, 440px);
      }
      #era-label {
        font-size: 13px; font-weight: 600; min-width: 4.6em; text-align: center;
        color: var(--bp-cyan); letter-spacing: 0.06em;
      }
      #era-slider { flex: 1; accent-color: var(--bp-cyan); margin: 0; }
      #era .tick { font-size: 9px; color: var(--bp-muted); }

      @media (max-width: 480px) {
        #panel { max-width: 180px; font-size: 12px; }
        #legend { grid-template-columns: 1fr; }
        #era { width: 86vw; gap: 8px; padding: 8px 12px; }
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="panel" class="hud">
      <h1>Transit Japan 3D</h1>
      <p class="sub">// nationwide public transport</p>
      <label><input type="checkbox" id="toggle-rail" checked /><span class="chip" style="background:#5b8cff"></span>鉄道路線</label>
      <label><input type="checkbox" id="toggle-stations" checked /><span class="chip dot" style="background:#e8edf7"></span>駅</label>
      <label><input type="checkbox" id="toggle-bus" /><span class="chip" style="background:#ffca28"></span>バス<span class="tick" style="font-family:var(--mono);font-size:9px;color:var(--bp-muted)">(重め)</span></label>
      <label><input type="checkbox" id="toggle-ferry" checked /><span class="chip" style="background:#4dd0e1"></span>航路(船)</label>
      <label><input type="checkbox" id="toggle-air" checked /><span class="chip" style="background:#f06292"></span>空路・空港</label>
      <label><input type="checkbox" id="toggle-ropeway" checked /><span class="chip" style="background:#aed581"></span>索道</label>
      <div id="legend">
        <span><span class="chip" style="background:#38d39f"></span>新幹線</span>
        <span><span class="chip" style="background:#5b8cff"></span>JR</span>
        <span><span class="chip" style="background:#ffab40"></span>民鉄</span>
        <span><span class="chip" style="background:#ff6384"></span>路面電車</span>
        <span><span class="chip" style="background:#ba68c8"></span>モノレール</span>
        <span><span class="chip" style="background:#ffeb3b"></span>ケーブルカー</span>
      </div>
    </div>
    <div id="tooltip" class="hud"></div>
    <div id="era" class="hud">
      <span class="tick">1950</span>
      <input type="range" id="era-slider" min="1950" max="2026" step="1" value="2026" aria-label="表示する年代" />
      <span id="era-label">現在</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
